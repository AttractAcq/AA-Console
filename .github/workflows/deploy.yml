name: Deploy to GitHub Pages

# console.attractacq.com. The runtime (Railway) is deployed separately from
# agent-runtime/ — this publishes only the browser app. A main push starts CI;
# the browser is built only after that exact main SHA passes every CI job.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race to the same site. Queue instead of cancelling:
# the losing run would otherwise leave the domain on an older build.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # workflow_run is privileged. PR runs, forks, and failed/incomplete CI
    # never check out code or receive the Pages/secret-bearing job context.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Build scripts need public Git history but no checkout credential.
          persist-credentials: false
          # The live release manifest pins earlier component commits when
          # Railway correctly skips an unchanged service on this main push.
          fetch-depth: 0

      - name: Require the tested SHA to be current main
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/assert-current-deploy-sha.sh "$TESTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep a missing migration dependency from publishing a frontend built
      # against the wrong schema, even after an all-green CI run.
      - name: Require sequential migration dependencies
        run: node scripts/schema-migration-order.mjs

      # A PR can introduce a migration before it is applied to production.
      # Wait for the reviewed marker update instead of publishing a browser
      # that expects a schema which has not been released yet.
      - name: Require released schema marker at tracked head
        run: node scripts/require-released-schema.mjs

      - run: npm ci

      - name: Verify runtime parity source manifest
        run: node scripts/schema-parity-runtime-manifest.mjs --check

      # A missing key does not fail the build — Vite substitutes undefined
      # and the app ships, rendering a login page that cannot reach anything.
      # Checking here turns a confusing runtime failure into an obvious
      # red build.
      - name: Check the build has its configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The deploy publishes to a real domain, so it does not ship a bundle
      # whose own tests fail. CI runs these too; the duplication is one npm ci.
      - run: npm run lint
      - run: npm test

      - name: Build
        env:
          # Non-secret identity of the browser bundle actually published.
          VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional. Absent means the Master AI reports itself unconfigured
          # rather than the app failing to build.
          VITE_AGENT_RUNTIME_URL: ${{ secrets.VITE_AGENT_RUNTIME_URL }}
        run: npm run build

      # The app uses BrowserRouter, so /clients/<id>/delivery/dashboard is a
      # real URL a person can reload or bookmark. Pages has no server to
      # rewrite it, and serves 404.html — which is this same app, so the
      # router resolves the path on the client.
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      # public/CNAME is copied into dist by Vite and pins the custom domain
      # to the artifact, so a deploy cannot quietly drop it.
      - name: Verify the custom domain survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing"; exit 1; }
          echo "Serving $(cat dist/CNAME)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Recheck current main before external publication
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/assert-current-deploy-sha.sh "$TESTED_SHA"

      - name: Require live runtime, gateway and schema identities
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/assert-live-release-identities.mjs

      # A newer main can arrive during the bounded live deployment wait.
      - name: Recheck current main after live identity wait
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/assert-current-deploy-sha.sh "$TESTED_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
