name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-replay:
    name: Schema replay (clean, upgrade, catalog, types)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check isolated replay preparation
        run: node --test scripts/prepare-schema-replay.test.mjs scripts/schema-migration-order.test.mjs scripts/schema-replay-fingerprint.test.mjs scripts/assert-current-deploy-sha.test.mjs scripts/assert-live-release-identities.check.mjs scripts/verify-github-release-candidate.check.mjs
      - name: Require sequential migration dependencies
        run: node scripts/schema-migration-order.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay schema and compare types
        env:
          AA_SCHEMA_EVIDENCE_DIR: schema-replay-evidence
          AA_SCHEMA_REPLAY_RAW_SOURCE: '1'
          AA_SCHEMA_PHASE3_SMOKES: '1'
          AA_SCHEMA_PHASE4_SMOKES: '1'
          AA_SCHEMA_PHASE5_SMOKES: '1'
          AA_SCHEMA_PHASE8_SMOKES: '1'
        run: bash scripts/schema-replay-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-replay-evidence/
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify runtime parity source manifest
        run: node scripts/schema-parity-runtime-manifest.mjs --check
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  agent-runtime:
    name: Agent runtime (typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci
      - name: Use locked media binaries for render tests
        run: |
          media_bin="$RUNNER_TEMP/aa-media-bin"
          mkdir -p "$media_bin"
          ln -s "$(node -p "require('ffmpeg-static')")" "$media_bin/ffmpeg"
          ln -s "$(node -p "require('ffprobe-static').path")" "$media_bin/ffprobe"
          "$media_bin/ffmpeg" -hide_banner -filters > "$RUNNER_TEMP/aa-ffmpeg-filters.txt"
          grep -q 'xfade' "$RUNNER_TEMP/aa-ffmpeg-filters.txt"
          grep -q 'drawtext' "$RUNNER_TEMP/aa-ffmpeg-filters.txt"
          "$media_bin/ffprobe" -version > /dev/null
          echo "$media_bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm test
      - run: node --test ingress/server.node-test.mjs
      - run: npm run build
      # Vitest transforms ESM modules and missed a real production import
      # cycle. Import the compiled module under Node 22 as Railway does.
      - run: node --input-type=module -e "await import('./dist/campaigns/actions/executor.js')"
      # With credentials deliberately absent, the complete server module graph
      # must reach config validation before it could start a worker or HTTP port.
      - run: >-
          ANTHROPIC_API_KEY= node --input-type=module -e
          "try { await import('./dist/server.js'); throw new Error('Server unexpectedly started'); }
          catch (error) { if (error?.message !== 'Missing required environment variable: ANTHROPIC_API_KEY') throw error; }"

  aa-mcp-gateway:
    name: MCP gateway (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aa-mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aa-mcp-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
