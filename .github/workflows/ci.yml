name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  agent-runtime:
    name: Agent runtime (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      # video_edit's render tests shell out to ffmpeg and skip when it is
      # absent. Skipping silently is how a render path stays untested, so it
      # is installed here rather than tolerated.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  aa-mcp-gateway:
    name: MCP gateway (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aa-mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aa-mcp-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
