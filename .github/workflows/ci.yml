name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-replay:
    name: Schema replay (clean, upgrade, catalog, types)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check isolated replay preparation
        run: node --test scripts/prepare-schema-replay.test.mjs scripts/schema-migration-order.test.mjs scripts/schema-replay-fingerprint.test.mjs scripts/assert-current-deploy-sha.test.mjs scripts/staging-reconciliation-workspace.test.mjs
      - name: Require sequential migration dependencies
        run: node scripts/schema-migration-order.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay schema and compare types
        env:
          AA_SCHEMA_EVIDENCE_DIR: schema-replay-evidence
          AA_SCHEMA_REPLAY_RAW_SOURCE: '1'
        run: bash scripts/schema-replay-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-replay-evidence/
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify runtime parity source manifest
        run: node scripts/schema-parity-runtime-manifest.mjs --check
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  agent-runtime:
    name: Agent runtime (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      # video_edit's render tests shell out to ffmpeg and skip when it is
      # absent. Skipping silently is how a render path stays untested, so it
      # is installed here rather than tolerated.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  aa-mcp-gateway:
    name: MCP gateway (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aa-mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aa-mcp-gateway/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
