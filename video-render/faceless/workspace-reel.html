<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Workspace layout comparison</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F5F7F3;font-family:system-ui,sans-serif;color:#192925}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#design{position:absolute;width:720px;height:1280px;transform-origin:0 0;transform:scale(1.5)}
#label{position:absolute;top:108px;left:62px;margin:0;color:var(--ink);font-weight:650;font-size:24px}
#board{position:absolute;left:44px;top:222px;width:632px;height:644px;color:var(--ink)}
.room{stroke:var(--ink);stroke-width:3;fill:var(--paper)}
.equipment{fill:var(--accent);stroke:var(--ink);stroke-width:3}
.map-label{font-size:22px;font-weight:600;fill:var(--ink);text-anchor:middle}
.detail{fill:none;stroke:var(--ink);stroke-width:2}
.route{fill:none;stroke:var(--primary);stroke-dasharray:1;stroke-dashoffset:1;stroke-width:5;stroke-linecap:round}
#captions{position:absolute;left:62px;right:62px;top:918px}
.caption{position:absolute;margin:0;font-size:48px;letter-spacing:-1.4px;font-weight:620;line-height:1.12;color:var(--ink);text-wrap:balance}
</style></head><body>
<main id="reel" data-composition-id="workspace-reel" data-start="0" data-width="1080" data-height="1920" data-duration="DURATION">
<div id="design"><p id="label">Synthetic QA fixture · Illustrative example</p>
<svg id="board" viewBox="0 0 620 620" aria-label="Two possible positions for a cart beside a round worktable and stool">
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="currentColor" stroke-opacity=".10"/></pattern>
<g id="room"><rect class="room" x="35" y="44" width="550" height="532" rx="5"/><rect x="36" y="45" width="548" height="530" fill="url(#grid)"/>
<circle class="equipment" cx="205" cy="215" r="88"/><circle class="detail" cx="205" cy="215" r="81"/><text class="map-label" x="205" y="246">Worktable</text>
<circle class="equipment" cx="315" cy="330" r="32"/><circle class="detail" cx="315" cy="330" r="23"/><text class="map-label" x="315" y="292">Stool</text></g>
<g id="cart"><text class="map-label" x="43" y="-12">Cart</text><rect class="equipment" width="86" height="62" rx="9"/><rect class="detail" x="10" y="10" width="66" height="40" rx="5"/>
<path class="detail" d="M10 60v8h13v-8m40 0v8h13v-8"/></g>
<g id="felt"><rect class="equipment" x="-24" y="-8" width="48" height="16" rx="7"/><ellipse class="detail" cx="17" cy="0" rx="5" ry="7"/></g>
</defs>
<g id="option1"><use href="#room"/><path id="path1" class="route" pathLength="1" d="M265 260 Q225 390 345 413 T445 459"/><g transform="translate(415 430)"><use href="#cart"/></g><g id="roll"><use href="#felt" x="211" y="191"/></g></g>
<g id="option2" opacity="0"><use href="#room"/><path id="path2" class="route" pathLength="1" d="M265 260 Q334 205 424 245"/><g id="movingCart" transform="translate(415 430)"><use href="#cart"/><use href="#felt" x="43" y="30"/></g></g>
</svg><div id="captions">CAPTIONS</div>
</div></main>
<script src="./gsap.min.js"></script>
<script>
const stops = STOPS;
const length = stops[stops.length - 1];
const tl = gsap.timeline({paused:true});
const a = document.querySelector('#option1'), b = document.querySelector('#option2');
tl.fromTo('#board',{scale:.92},{scale:1,duration:stops[1],ease:'power1.out'},0)
  .to('#option1',{scale:1.09,svgOrigin:'205 215',duration:1},stops[1])
  .to('#option1',{scale:1,duration:1},stops[2])
  .fromTo('#cart .equipment',{strokeWidth:3},{strokeWidth:8,duration:.7,repeat:1,yoyo:true},stops[2]+.2)
  .to('#path1',{strokeDashoffset:0,duration:stops[4]-stops[3]-.4,ease:'power1.inOut'},stops[3])
  .to('#roll',{x:247,y:269,duration:.5},stops[4]-.55)
  .to(a,{scale:.52,x:144,y:-12,svgOrigin:'0 0',duration:1},stops[4])
  .set(b,{scale:.52,x:144,y:296,svgOrigin:'0 0'},stops[4])
  .to(b,{opacity:1,duration:.6},stops[4]+.45)
  .to('#movingCart',{attr:{transform:'translate(407 218)'},duration:1.5,ease:'power2.inOut'},stops[4]+1.15)
  .to('#path2',{strokeDashoffset:0,duration:2},stops[5])
  .to({}, {duration:length-stops[6]},stops[6]);
window.__timelines = {'workspace-reel':tl};
</script></body></html>
